<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create an account</title></head>
<body>
    <main>
        <h1>Create an account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
        <p><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
    </main>
</body>
</html>
